<style>
*{box-sizing:border-box}
body{margin:0;background:#e9f3fa;color:#183b55;font-family:Meiryo,"Yu Gothic",sans-serif}
header{height:55px;display:flex;justify-content:flex-end;align-items:center;padding:6px 12px}
button{font:inherit;cursor:pointer}
.teacher{padding:9px 15px;border:2px solid #54758b;border-radius:12px;background:white;font-weight:bold}
main{min-height:calc(100vh - 55px);display:flex;align-items:center;justify-content:center;padding:10px}
.lesson,.end{width:min(1100px,100%);min-height:calc(100vh - 85px);background:#fffdf7;border-radius:24px;box-shadow:0 5px 20px #3455;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:20px;cursor:pointer}
.counter{font-size:22px;font-weight:bold;color:#55758b}
h1{font-size:clamp(30px,5vw,54px);margin:8px 0;color:#174b70}
.reading{font-size:clamp(19px,2.5vw,27px);font-weight:bold}
.city{font-size:22px;margin-top:6px;color:#55758b}
.picture{width:100%;max-width:850px;flex:1;min-height:240px;display:flex;align-items:center;justify-content:center;margin:12px}
.picture svg{width:100%;height:100%;max-height:440px;border-radius:20px}
.hint{background:#e1f2ff;color:#17649a;border-radius:16px;padding:13px 24px;font-size:clamp(18px,2.5vw,25px);font-weight:bold}
.end{display:none;justify-content:center;gap:25px;cursor:default}
.end p{font-size:27px;line-height:1.7}
.restart{background:#217bb7;color:white;border:0;border-radius:18px;padding:17px 38px;font-size:27px;font-weight:bold}
.panel{display:none;position:fixed;inset:0;background:#10283dcc;z-index:10;align-items:center;justify-content:center;padding:12px}
.panelbox{background:white;border-radius:20px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}
.panelbox h2{margin-top:0}
.entry{border-top:1px solid #ddd;padding:13px 0}
.entry strong{display:block;font-size:18px;margin-bottom:8px}
.entry button,.close{padding:9px 13px;margin:3px;border:0;border-radius:10px;background:#e5f1f8;font-weight:bold}
.entry .record{background:#dff2e5;color:#155c31}
.entry .delete{background:#fbe5e5;color:#8a2525}
.close{background:#294e69;color:white}
audio{width:100%;margin-top:8px}
@media(max-width:600px){
 .lesson,.end{min-height:calc(100vh - 70px);padding:14px}
 .picture{min-height:220px}
 .end p{font-size:22px}
}

<body>
<header>
<button class="teacher" id="teacherOpen">先生用・録音設定</button>
</header>

 <div class="counter" id="counter">1 / 6</div>

  <div class="city" id="city"></div>

 <div class="picture" id="picture"></div>
 <div class="hint">画面のどこかをタッチしてね！</div>
</section>

<section class="end" id="end">
 <h1>おしまい！</h1>

 <button class="restart" id="restart">もういちど見る</button>

const $=id=>document.getElementById(id);
let current=0;

function showPlace(){
 const p=places[current];
 $("counter").textContent=(current+1)+" / 6";
 $("name").textContent=p.name;
 $("reading").textContent=p.reading;
 $("city").textContent=p.city;
 $("picture").innerHTML=p.art;
}
function next(){
 if($("panel").style.display==="flex")return;
 if(current<5){current++;showPlace();}
 else{$("lesson").style.display="none";$("end").style.display="flex";}
}
function restart(){
 current=0;
 $("end").style.display="none";
 $("lesson").style.display="flex";
 showPlace();
}
$("lesson").addEventListener("click",next);
$("lesson").addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" "){e.preventDefault();next();}
});
$("restart").addEventListener("click",restart);
$("teacherOpen").addEventListener("click",()=>{
 $("panel").style.display="flex";
 drawRecorder();
});
$("closePanel").addEventListener("click",()=>{$("panel").style.display="none";});

const DB_NAME="oita_audio_v1";
function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore("audio");
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}
async function saveAudio(i,blob){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const r=db.transaction("audio","readwrite").objectStore("audio").put(blob,i);
  r.onsuccess=resolve;r.onerror=reject;
 });
}
async function getAudio(i){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const r=db.transaction("audio").objectStore("audio").get(i);
  r.onsuccess=()=>resolve(r.result);
  r.onerror=reject;
 });
}
async function deleteAudio(i){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const r=db.transaction("audio","readwrite").objectStore("audio").delete(i);
  r.onsuccess=resolve;r.onerror=reject;
 });
}

async function drawRecorder(){
 const root=$("entries");
 root.innerHTML="";
 for(let i=0;i<places.length;i++){
  const row=document.createElement("div");
  row.className="entry";
  const title=document.createElement("strong");
  title.textContent=(i+1)+". "+places[i].name;
  const status=document.createElement("span");
  const record=document.createElement("button");
  record.className="record";
  record.textContent="録音する";
  const play=document.createElement("button");
  play.textContent="再生";
  const del=document.createElement("button");
  del.className="delete";
  del.textContent="削除";
  const audio=document.createElement("audio");
  audio.controls=true;
  audio.style.display="none";
  row.append(title,status,record,play,del,audio);
  root.append(row);

  let blob=null;
  try{blob=await getAudio(i);}catch(e){}
  status.textContent=blob?"録音データあり":"録音データなし";
  if(blob){
   audio.src=URL.createObjectURL(blob);
   audio.style.display="block";
  }

  let recorder=null;
  let chunks=[];
  let stream=null;
  record.addEventListener("click",async()=>{
   if(recorder&&recorder.state==="recording"){
    recorder.stop();
    record.textContent="録音する";
    return;
   }
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    alert("録音にはHTTPSで開く必要があります。");
    return;
   }
   try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recorder=new MediaRecorder(stream);
    chunks=[];
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    recorder.onstop=async()=>{
     stream.getTracks().forEach(t=>t.stop());
     const newBlob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
     await saveAudio(i,newBlob);
     if(audio.src)URL.revokeObjectURL(audio.src);
     audio.src=URL.createObjectURL(newBlob);
     audio.style.display="block";
     status.textContent="録音データあり";
     record.textContent="録音する";
    };
    recorder.start();
    record.textContent="録音を停止";
    status.textContent="録音中…";
   }catch(e){
    alert("マイクを使えません。ブラウザのマイク許可を確認してください。");
   }
  });
  play.addEventListener("click",()=>{
   if(audio.src)audio.play();
   else alert("まだ録音されていません。");
  });
  del.addEventListener("click",async()=>{
   await deleteAudio(i);
   if(audio.src)URL.revokeObjectURL(audio.src);
   audio.removeAttribute("src");
   audio.style.display="none";
   status.textContent="録音データなし";
  });
 }
}
showPlace();
</script>
