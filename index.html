<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大分県の名所</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Meiryo,"Yu Gothic",sans-serif;background:#102b40}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:#eaf7ff}
header .title{font-size:clamp(18px,3vw,27px);font-weight:800;color:#174b70}
button{font:inherit;cursor:pointer}
.teacher{border:0;border-radius:12px;padding:9px 13px;background:#176bb2;color:white;font-weight:bold;font-size:14px}
#slide{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#102b40}
#photo{width:100%;height:100%;object-fit:contain;display:block}
#placeName{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:92%;padding:9px 22px;border-radius:16px;background:#fff7d9eF;color:#123d69;font-weight:900;font-size:clamp(22px,4vw,38px);white-space:nowrap;text-align:center;box-shadow:0 2px 8px #0005;pointer-events:none}
#counter{position:absolute;top:12px;left:14px;background:#ffffffdf;color:#123d69;border-radius:14px;padding:5px 13px;font-size:18px;font-weight:bold;pointer-events:none}
#end{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:22px;background:#eaf7ff;color:#174b70;text-align:center}
#end h1{font-size:clamp(34px,7vw,60px);margin:0}
#end button{border:0;border-radius:18px;padding:15px 30px;background:#176bb2;color:white;font-size:24px;font-weight:bold}
#panel{display:none;position:fixed;inset:0;background:#071c2ddd;z-index:5;align-items:center;justify-content:center;padding:12px}
#panelbox{background:white;border-radius:18px;padding:20px;width:min(620px,100%);max-height:92vh;overflow:auto}
#panelbox h2{margin:0 0 8px}
.note{font-size:14px;color:#555}
.entry{border-top:1px solid #ddd;padding:12px 0}
.entry strong{display:block;margin-bottom:8px}
.entry button{border:0;border-radius:9px;padding:8px 12px;margin:3px;background:#e5f1f8;font-weight:bold}
.entry .rec{background:#dff2e5;color:#155c31}
.entry .del{background:#fbe5e5;color:#8a2525}
audio{display:block;width:100%;margin-top:8px}
.close{background:#294e69!important;color:white}
@media(max-width:600px){header{height:48px;padding:4px 8px}.teacher{padding:8px 9px;font-size:12px}#placeName{bottom:10px;padding:7px 13px}}
</style>
</head>

let index=0;
const slide=document.getElementById('slide'),photo=document.getElementById('photo'),nameEl=document.getElementById('placeName'),counter=document.getElementById('counter'),end=document.getElementById('end');
function show(){const p=places[index];photo.src=p.file;photo.alt=p.name;nameEl.textContent=p.name;counter.textContent=(index+1)+' / 6';}
function next(){if(index<5){index++;show()}else{slide.style.display='none';end.style.display='flex'}}
slide.addEventListener('click',next);
document.getElementById('restart').addEventListener('click',()=>{index=0;end.style.display='none';slide.style.display='flex';show()});
const DB='OitaPlaceAudioDB',STORE='recordings';let db;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function getAudio(key){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction(STORE).objectStore(STORE).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function saveAudio(key,value){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(value,key);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function deleteAudio(key){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).delete(key);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function drawEntries(){
 const root=document.getElementById('entries');root.innerHTML='';
 for(let i=0;i<places.length;i++){
  const entry=document.createElement('div');entry.className='entry';
  const strong=document.createElement('strong');strong.textContent=places[i].name;entry.appendChild(strong);
  const rec=document.createElement('button');rec.className='rec';rec.textContent='録音開始';entry.appendChild(rec);
  const play=document.createElement('button');play.textContent='再生';entry.appendChild(play);
  const del=document.createElement('button');del.className='del';del.textContent='削除';entry.appendChild(del);
  const audio=document.createElement('audio');audio.controls=true;audio.style.display='none';entry.appendChild(audio);
  let blob=await getAudio('place'+i);
  async function refresh(){blob=await getAudio('place'+i);if(blob){audio.src=URL.createObjectURL(blob);audio.style.display='block';play.disabled=false;del.disabled=false}else{audio.removeAttribute('src');audio.style.display='none';play.disabled=true;del.disabled=true}}
  await refresh();
  let recorder=null,chunks=[];
  rec.addEventListener('click',async()=>{
   if(recorder&&recorder.state==='recording'){recorder.stop();return}
   try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recorder=new MediaRecorder(stream);chunks=[];
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=async()=>{const b=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});await saveAudio('place'+i,b);stream.getTracks().forEach(t=>t.stop());rec.textContent='録音開始';await refresh()};
    recorder.start();rec.textContent='録音停止';
   }catch(e){alert('マイクを使用できません。ブラウザのマイク許可を確認してください。');}
  });
  play.addEventListener('click',async()=>{await refresh();if(audio.src){audio.play()}});
  del.addEventListener('click',async()=>{if(confirm('この録音を削除しますか？')){await deleteAudio('place'+i);await refresh()}});
  root.appendChild(entry);
 }
}
document.getElementById('teacherOpen').addEventListener('click',async()=>{document.getElementById('panel').style.display='flex';await drawEntries()});
document.getElementById('closePanel').addEventListener('click',()=>document.getElementById('panel').style.display='none');
document.getElementById('panel').addEventListener('click',e=>{if(e.target.id==='panel')e.currentTarget.style.display='none'});
show();
</script>
</body>
</html>
